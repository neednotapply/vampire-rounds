<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Vampire Rounds's cover art, painted in code (no game files): Vampire Survivors's blood-moon cover played by ROUNDS's
     faceted balls. tools/cover.py renders it with headless Edge; open it with ?out=card&show=1 to look at one scene. -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Lilita+One&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#111;color:#ccc;font:12px monospace}canvas{display:block;max-width:100%}</style>
</head>
<body>
<script>
"use strict";
// ------------------------------------------------------------------ helpers
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rand=mulberry32(1);
const rr=(a,b)=>a+(b-a)*rand();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2]);return[a[0]/l,a[1]/l,a[2]/l]};
const D=d=>d*Math.PI/180;

// Catmull-Rom through points (open or closed), as bezier curves.
function smooth(ctx,pts,closed){
  const n=pts.length,get=i=>closed?pts[(i+n)%n]:pts[clamp(i,0,n-1)];
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=0;i<(closed?n:n-1);i++){
    const p0=get(i-1),p1=get(i),p2=get(i+1),p3=get(i+2);
    ctx.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]);
  }
  if(closed)ctx.closePath();
}
function poly(ctx,pts){ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath()}

// ------------------------------------------------------------------ ROUNDS's faceted ball (a jittered icosphere, flat shaded)
const ballCache={};
function makeBall(sub,seed,jitter){
  const key=sub+"/"+seed+"/"+jitter;if(ballCache[key])return ballCache[key];
  const rnd=mulberry32(seed*7919+13),t=(1+Math.sqrt(5))/2;
  let V=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(norm);
  let F=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  for(let s=0;s<sub;s++){
    const cache=new Map(),NF=[];
    const mid=(a,b)=>{const k=a<b?a+"_"+b:b+"_"+a;if(cache.has(k))return cache.get(k);V.push(norm(add(V[a],V[b])));cache.set(k,V.length-1);return V.length-1};
    for(const[a,b,c]of F){const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);NF.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca])}
    F=NF;
  }
  const ax=rnd()*6.28,ay=rnd()*6.28,az=rnd()*6.28;
  const rot=v=>{let[x,y,z]=v,c=Math.cos(ax),s=Math.sin(ax);[y,z]=[y*c-z*s,y*s+z*c];c=Math.cos(ay);s=Math.sin(ay);[x,z]=[x*c+z*s,-x*s+z*c];c=Math.cos(az);s=Math.sin(az);[x,y]=[x*c-y*s,x*s+y*c];return[x,y,z]};
  V=V.map(v=>norm(add(rot(v),[(rnd()-.5)*jitter,(rnd()-.5)*jitter,(rnd()-.5)*jitter])));
  const shade=F.map(()=>rnd()-.5);
  return ballCache[key]={V,F,shade};
}
// m: {base, amb (0..1 per channel), lights:[{d,c,k,wrap,pow,add,spec,shin}], sub, seed, jitter, vary}
// Coordinates: x right, y down, z toward the viewer.
function drawBall(ctx,cx,cy,r,m){
  const b=makeBall(m.sub??2,m.seed??1,m.jitter??0.1),faces=[];
  b.F.forEach((f,i)=>{
    const A=b.V[f[0]],B=b.V[f[1]],C=b.V[f[2]];
    let n=norm(cross(sub(B,A),sub(C,A)));
    const cen=[(A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3,(A[2]+B[2]+C[2])/3];
    if(dot(n,cen)<0)n=[-n[0],-n[1],-n[2]];
    if(n[2]<=0.0)return;
    const col=[m.base[0]*m.amb[0],m.base[1]*m.amb[1],m.base[2]*m.amb[2]];
    for(const L of m.lights){
      const d=dot(n,L.d),w=L.wrap||0,k=Math.pow(Math.max(0,(d+w)/(1+w)),L.pow||1)*L.k;
      for(let j=0;j<3;j++)col[j]+=m.base[j]*L.c[j]/255*k+(L.add||0)*L.c[j]*k;
      if(L.spec){const h=norm(add(L.d,[0,0,1])),s=Math.pow(Math.max(0,dot(n,h)),L.shin||24)*L.spec;for(let j=0;j<3;j++)col[j]+=L.c[j]*s}
    }
    const v=1+b.shade[i]*(m.vary??0.14);
    faces.push({z:cen[2],p:[A,B,C],c:col.map(x=>clamp(x*v,0,255))});
  });
  faces.sort((a,b)=>a.z-b.z);
  ctx.save();ctx.lineJoin="round";ctx.lineWidth=Math.max(0.8,r*0.004);
  for(const f of faces){
    ctx.beginPath();poly(ctx,f.p.map(p=>[cx+p[0]*r,cy+p[1]*r]));
    ctx.fillStyle=ctx.strokeStyle=css(f.c);ctx.fill();ctx.stroke();
  }
  ctx.restore();
}

// ------------------------------------------------------------------ lights (the moon is behind, up and to the right)
const L_MOONRIM={d:norm([0.62,-0.62,-0.42]),c:[255,70,120],k:1.25,add:0.35,wrap:0.15,pow:1.4};
const L_WARM={d:norm([0.45,0.25,0.85]),c:[255,165,95],k:0.95,wrap:0.1,pow:1.2,spec:0.25,shin:40};
const L_FILL={d:norm([-0.75,0.05,0.65]),c:[150,22,48],k:0.4};
function mat(base,seed,extra){return Object.assign({base,seed,amb:[0.16,0.05,0.08],lights:[L_MOONRIM,L_WARM,L_FILL],sub:2,jitter:0.11,vary:0.16},extra||{})}

// ------------------------------------------------------------------ the sky, the blood moon, clouds, the castle
function sky(ctx,W,H,moon){
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#16020a");g.addColorStop(0.4,"#3e0612");g.addColorStop(0.78,"#690c1c");g.addColorStop(1,"#2c040c");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  g=ctx.createRadialGradient(moon.x,moon.y,moon.r*0.7,moon.x,moon.y,moon.r*2.6);
  g.addColorStop(0,"rgba(235,45,90,0.6)");g.addColorStop(0.3,"rgba(170,22,56,0.32)");g.addColorStop(1,"rgba(90,0,24,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  blotches(ctx,W,H,48,27,0.32,"soft-light");
  blotches(ctx,W,H,160,90,0.12,"overlay");
}
// painterly unevenness: a tiny random picture blown up and blurred
function blotches(ctx,W,H,w,h,a,op){
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
  const id=x.createImageData(w,h);
  for(let i=0;i<w*h;i++){const v=rand();id.data[i*4]=v<0.5?20:200;id.data[i*4+1]=v*40;id.data[i*4+2]=v*60;id.data[i*4+3]=255*Math.abs(v-0.5)*2}
  x.putImageData(id,0,0);
  ctx.save();ctx.globalCompositeOperation=op;ctx.globalAlpha=a;ctx.imageSmoothingQuality="high";ctx.filter=`blur(${W/w*0.6}px)`;ctx.drawImage(c,0,0,W,H);ctx.restore();
}
function moonDraw(ctx,m){
  ctx.save();
  let g=ctx.createRadialGradient(m.x,m.y,m.r*0.9,m.x,m.y,m.r*1.7);
  g.addColorStop(0,"rgba(255,80,125,0.55)");g.addColorStop(0.4,"rgba(230,40,90,0.18)");g.addColorStop(1,"rgba(200,20,70,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(m.x,m.y,m.r*1.7,0,7);ctx.fill();
  drawBall(ctx,m.x,m.y,m.r,{seed:m.seed||5,sub:3,jitter:0.045,vary:0.1,base:[222,48,92],amb:[0.5,0.42,0.48],
    lights:[{d:norm([0.45,-0.55,0.7]),c:[255,215,225],k:0.62,wrap:0.5}]});
  ctx.beginPath();ctx.arc(m.x,m.y,m.r*1.01,0,7);ctx.clip();
  ctx.globalCompositeOperation="multiply";
  const spots=[[-0.35,-0.2,0.38],[0.25,0.15,0.3],[-0.05,0.45,0.25],[0.4,-0.4,0.18],[-0.55,0.3,0.22],[0.1,-0.55,0.15],[0.6,0.35,0.2]];
  for(const[x,y,s]of spots){g=ctx.createRadialGradient(m.x+x*m.r,m.y+y*m.r,0,m.x+x*m.r,m.y+y*m.r,s*m.r);g.addColorStop(0,"rgba(150,30,70,0.55)");g.addColorStop(1,"rgba(150,30,70,0)");ctx.fillStyle=g;ctx.fillRect(m.x-m.r,m.y-m.r,m.r*2,m.r*2)}
  g=ctx.createLinearGradient(m.x+m.r*0.5,m.y-m.r*0.7,m.x-m.r*0.8,m.y+m.r*0.9);
  g.addColorStop(0,"rgba(255,255,255,1)");g.addColorStop(1,"rgba(110,10,40,1)");
  ctx.fillStyle=g;ctx.fillRect(m.x-m.r,m.y-m.r,m.r*2,m.r*2);
  ctx.restore();
  ctx.save();ctx.globalCompositeOperation="screen";ctx.filter=`blur(${m.r*0.02}px)`;ctx.strokeStyle="rgba(255,150,180,0.5)";ctx.lineWidth=m.r*0.02;
  ctx.beginPath();ctx.arc(m.x,m.y,m.r*0.99,D(-150),D(60));ctx.stroke();ctx.restore();
}
function clouds(ctx,list){
  for(const c of list){
    ctx.save();ctx.filter=`blur(${c.h*0.45}px)`;ctx.fillStyle=css(c.col,c.a);
    ctx.beginPath();ctx.ellipse(c.x,c.y,c.w,c.h,c.rot||0,0,7);ctx.fill();ctx.restore();
  }
}
function castle(ctx,o){
  const{baseY,towers,col,edge,win,moonX}=o;
  ctx.save();ctx.fillStyle=col;
  // curtain walls with battlements between the towers
  if(o.wall){const[x0,x1,h]=o.wall;ctx.fillRect(x0,baseY-h,x1-x0,h+400);
    for(let x=x0;x<x1;x+=h*0.22)ctx.fillRect(x,baseY-h-h*0.12,h*0.12,h*0.13)}
  for(const t of towers){
    const top=baseY-t.h,hw=t.w/2;
    ctx.fillStyle=col;ctx.fillRect(t.x-hw,top,t.w,t.h+400);
    ctx.fillRect(t.x-hw*1.22,top-t.w*0.1,t.w*1.22,t.w*0.14);
    ctx.beginPath();ctx.moveTo(t.x-hw*1.18,top-t.w*0.08);ctx.lineTo(t.x,top-t.sp);ctx.lineTo(t.x+hw*1.18,top-t.w*0.08);ctx.fill();
    ctx.fillRect(t.x-t.w*0.02,top-t.sp-t.w*0.35,t.w*0.04,t.w*0.36);
    if(t.turret){const tx=t.x+t.turret*hw,ty=top+t.h*0.25,tw=t.w*0.32;ctx.fillRect(tx-tw/2,ty,tw,t.w*0.9);ctx.beginPath();ctx.moveTo(tx-tw*0.65,ty);ctx.lineTo(tx,ty-t.w*0.75);ctx.lineTo(tx+tw*0.65,ty);ctx.fill()}
    if(edge){ // the side facing the moon catches its light
      ctx.save();ctx.fillStyle=edge;const s=t.x<moonX?1:-1,ex=s>0?t.x+hw-t.w*0.06:t.x-hw;
      ctx.fillRect(ex,top,t.w*0.06,t.h);
      ctx.beginPath();ctx.moveTo(t.x,top-t.sp);ctx.lineTo(t.x+s*hw*1.18,top-t.w*0.08);ctx.lineTo(t.x+s*hw*0.9,top-t.w*0.08);ctx.fill();ctx.restore();
    }
    if(win&&t.win){
      ctx.save();ctx.fillStyle=win;ctx.shadowColor=win;ctx.shadowBlur=t.w*0.3;
      for(const[wx,wy]of t.win){const x=t.x+wx*hw,y=top+wy*t.h,ww=t.w*0.11,wh=t.w*0.3;
        ctx.beginPath();ctx.moveTo(x-ww/2,y+wh);ctx.lineTo(x-ww/2,y);ctx.arc(x,y,ww/2,Math.PI,0);ctx.lineTo(x+ww/2,y+wh);ctx.fill()}
      ctx.restore();
    }
  }
  ctx.restore();
}

// ------------------------------------------------------------------ bats (VS's), wings for the bat balls
function batWing(ctx,sx,sy,dir,span,lift,fill,bone){
  const tip=[sx+dir*span,sy-lift],top=[sx+dir*span*0.45,sy-lift*1.25-span*0.18];
  const p=[[sx+dir*span*0.74,sy-lift*0.35+span*0.2],[sx+dir*span*0.45,sy+span*0.16],[sx+dir*span*0.14,sy+span*0.26]];
  ctx.beginPath();ctx.moveTo(sx,sy-span*0.05);ctx.quadraticCurveTo(top[0],top[1],tip[0],tip[1]);
  let a=tip;for(const q of p){const mx=(a[0]+q[0])/2-dir*span*0.04,my=(a[1]+q[1])/2-span*0.1;ctx.quadraticCurveTo(mx,my,q[0],q[1]);a=q}
  ctx.lineTo(sx,sy+span*0.12);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(bone){ctx.strokeStyle=bone;ctx.lineWidth=Math.max(1,span*0.025);ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(top[0],top[1]+span*0.08,tip[0],tip[1]);
    for(const q of p.slice(0,2)){ctx.moveTo(sx+dir*span*0.42,sy-lift*0.75-span*0.1);ctx.lineTo(q[0],q[1])}ctx.stroke()}
}
function bat(ctx,x,y,s,flap,col){
  ctx.save();
  batWing(ctx,x-s*0.12,y,-1,s,s*flap,col);batWing(ctx,x+s*0.12,y,1,s,s*flap,col);
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y+s*0.08,s*0.16,s*0.24,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(x-s*0.14,y-s*0.1);ctx.lineTo(x-s*0.12,y-s*0.32);ctx.lineTo(x-s*0.03,y-s*0.16);ctx.lineTo(x+s*0.03,y-s*0.16);ctx.lineTo(x+s*0.12,y-s*0.32);ctx.lineTo(x+s*0.14,y-s*0.1);ctx.fill();
  ctx.restore();
}

// ------------------------------------------------------------------ ROUNDS's pistol (the gun icon's shape), arms, smoke
function pistol(ctx,x,y,len,ang,fill,rim){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(len/22,len/22);ctx.translate(-10,-14);
  ctx.beginPath();poly(ctx,[[5,11],[27,11],[27,16],[14,16],[12,25],[6,25],[8,16],[5,16]]);
  ctx.fillStyle=fill;ctx.fill();
  ctx.lineJoin="round";ctx.strokeStyle="#000";ctx.lineWidth=0.6;ctx.stroke();
  if(rim){ctx.strokeStyle=rim;ctx.lineWidth=0.55;ctx.beginPath();ctx.moveTo(5.3,11.3);ctx.lineTo(26.7,11.3);ctx.lineTo(26.7,15.4);ctx.stroke()}
  ctx.fillStyle="rgba(120,40,60,0.9)";ctx.fillRect(21,12,5,1.1);
  ctx.restore();
}
function limb(ctx,pts,w,rim){
  ctx.save();ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();smooth(ctx,pts,false);ctx.strokeStyle="#0a0306";ctx.lineWidth=w;ctx.stroke();
  if(rim){ctx.beginPath();smooth(ctx,pts.map(p=>[p[0]+w*0.18,p[1]-w*0.22]),false);ctx.strokeStyle=rim;ctx.lineWidth=w*0.28;ctx.stroke()}
  ctx.restore();
}
function smoke(ctx,x,y,len,s){
  ctx.save();
  for(let i=0;i<18;i++){const t=i/17,px=x+Math.sin(t*5.5)*len*0.12*t+len*0.08*t,py=y-len*t,r=s*(0.35+t*1.3);
    ctx.filter=`blur(${r*0.45}px)`;ctx.fillStyle=`rgba(255,215,222,${0.5*(1-t)+0.05})`;ctx.beginPath();ctx.arc(px,py,r*1.4,0,7);ctx.fill()}
  ctx.restore();
}

// ------------------------------------------------------------------ the characters
// Orange, cast as the Count: slicked-back hair, glowing eyes, fangs, a high collar and a smoking pistol.
function orangeCount(ctx,cx,cy,r,o={}){
  const S=(u,v)=>[cx+u*r,cy+v*r];
  let g;
  // the cape over the shoulders, behind the ball
  ctx.save();
  ctx.fillStyle="#0b0206";ctx.beginPath();
  smooth(ctx,[S(-0.9,0.75),S(-1.4,1.0),S(-1.7,1.45),S(-1.85,2.4),S(1.85,2.4),S(1.7,1.45),S(1.4,1.0),S(0.9,0.75),S(0,0.7)],true);ctx.fill();
  ctx.lineCap="round";ctx.strokeStyle="rgba(255,70,120,0.35)";ctx.lineWidth=r*0.012;
  ctx.beginPath();smooth(ctx,[S(1.02,0.86),S(1.42,1.02),S(1.7,1.45),S(1.8,2.2)],false);ctx.stroke();
  // the high collar: black outside, a pleated crimson lining
  for(const s of[-1,1]){
    const P=(u,v)=>S(s*u*(s<0?1.05:1),v);
    ctx.fillStyle="#070105";ctx.beginPath();
    smooth(ctx,[P(0.35,0.95),P(0.98,0.84),P(1.38,0.38),P(1.56,-0.2),P(1.52,-0.8),P(1.3,-0.6),P(1.06,-0.4),P(0.82,-0.1),P(0.5,0.4)],true);ctx.fill();
    const lining=[P(0.55,0.78),P(0.93,0.68),P(1.24,0.3),P(1.38,-0.17),P(1.36,-0.58),P(1.21,-0.47),P(0.99,-0.28),P(0.78,0.02)];
    g=ctx.createLinearGradient(...P(0.9,0.5),...P(1.45,-0.55));g.addColorStop(0,"#1a0106");g.addColorStop(0.6,"#56051a");g.addColorStop(1,s>0?"#a0122f":"#6a0820");
    ctx.fillStyle=g;ctx.beginPath();smooth(ctx,lining,true);ctx.fill();
    ctx.save();ctx.beginPath();smooth(ctx,lining,true);ctx.clip();
    ctx.strokeStyle="rgba(30,0,8,0.55)";ctx.lineWidth=r*0.022;
    for(const[a,b]of[[[0.85,0.7],[1.4,-0.45]],[[0.8,0.6],[1.22,-0.42]],[[0.95,0.72],[1.5,-0.05]]]){ctx.beginPath();ctx.moveTo(...P(...a));ctx.quadraticCurveTo(...P((a[0]+b[0])/2+0.07,(a[1]+b[1])/2),...P(...b));ctx.stroke()}
    ctx.restore();
    ctx.strokeStyle=s>0?"rgba(255,100,150,0.9)":"rgba(255,60,100,0.4)";ctx.lineWidth=r*0.014;
    ctx.beginPath();smooth(ctx,[P(1.3,0.5),P(1.45,0.2),P(1.56,-0.2),P(1.52,-0.78)],false);ctx.stroke();
  }
  ctx.restore();
  drawBall(ctx,cx,cy,r,mat([244,118,34],o.seed||3,{vary:0.2}));
  // shadow over the far (left) side, so the features turn with the ball
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r*0.995,0,7);ctx.clip();
  g=ctx.createRadialGradient(...S(0.45,0.15),r*0.2,...S(0.2,0.1),r*1.3);
  g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(0.6,"rgba(40,0,12,0.32)");g.addColorStop(1,"rgba(20,0,8,0.88)");
  ctx.fillStyle=g;ctx.fillRect(cx-r,cy-r,2*r,2*r);
  for(const[u,v,s]of[[-0.3,-0.12,0.34],[0.56,-0.13,0.3]]){g=ctx.createRadialGradient(...S(u,v),0,...S(u,v),r*s);g.addColorStop(0,"rgba(40,0,10,0.75)");g.addColorStop(1,"rgba(40,0,10,0)");ctx.fillStyle=g;ctx.fillRect(cx-r,cy-r,2*r,2*r)}
  // the scar across the left eye
  ctx.lineCap="round";
  for(const[a,b,w]of[[S(-0.5,-0.62),S(-0.22,0.12),0.016],[S(-0.4,-0.6),S(-0.12,0.02),0.01]]){
    ctx.strokeStyle="rgba(60,0,12,0.75)";ctx.lineWidth=r*w*1.6;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();
    ctx.strokeStyle="rgba(255,150,130,0.3)";ctx.lineWidth=r*w*0.6;ctx.beginPath();ctx.moveTo(a[0]+r*0.008,a[1]);ctx.lineTo(b[0]+r*0.008,b[1]);ctx.stroke()}
  ctx.restore();

  for(let i=0;i<n;i++){const x=rr(box[0],box[2]),y=rr(box[1],box[3]),s=rr(1,4.5)*W/1920,big=rand()<0.08;

    else{ctx.shadowColor="rgba(255,120,40,0.9)";ctx.shadowBlur=s*4;ctx.fillStyle=`rgba(255,${(150+rand()*90)|0},90,${rr(0.4,0.95)})`;ctx.beginPath();ctx.arc(x,y,s,0,7);ctx.fill()}
  }
  ctx.restore();
}

  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,"rgba(120,12,36,0)");g.addColorStop(0.6,`rgba(140,16,42,${a})`);g.addColorStop(1,`rgba(90,6,24,${a})`);
  ctx.fillStyle=g;ctx.fillRect(0,y,W,h);

function finish(ctx,W,H,o={}){
  // bloom: the bright parts, blurred and screened back
  const b=document.createElement("canvas");b.width=W/4;b.height=H/4;const bx=b.getContext("2d");
  bx.filter="brightness(0.75) contrast(2.6) saturate(1.3)";bx.drawImage(ctx.canvas,0,0,b.width,b.height);
  ctx.save();ctx.globalCompositeOperation="screen";ctx.globalAlpha=o.bloom??0.45;ctx.filter=`blur(${W*0.008}px)`;ctx.drawImage(b,0,0,W,H);ctx.restore();
  // grade toward VS's crimson
  ctx.save();ctx.globalCompositeOperation="soft-light";ctx.fillStyle="rgba(200,20,50,0.2)";ctx.fillRect(0,0,W,H);ctx.restore();
  const g=ctx.createRadialGradient(W*0.55,H*0.45,H*0.35,W*0.5,H*0.5,W*0.72);
  g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,`rgba(12,0,4,${o.vignette??0.78})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const id=ctx.getImageData(0,0,W,H),d=id.data,gr=o.grain??11;
  for(let i=0;i<d.length;i+=4){const n=(rand()-0.5)*gr;d[i]+=n;d[i+1]+=n;d[i+2]+=n}
  ctx.putImageData(id,0,0);
}

async function main(){
  const p=new URLSearchParams(location.search),outs=(p.get("out")||"card").split(","),show=p.has("show");
  const W=+(p.get("w")||1920),H=+(p.get("h")||1080);
  try{await Promise.all([document.fonts.load('900 100px Cinzel'),document.fonts.load('100px "Lilita One"')])}catch(e){}
  const status=document.createElement("pre");status.id="status";
  status.textContent="fonts "+(document.fonts.check('900 100px Cinzel')&&document.fonts.check('100px "Lilita One"')?"ok":"missing");
  for(const name of outs){
    const c=document.createElement("canvas");c.width=W;c.height=H;const ctx=c.getContext("2d");
    ctx.scale(W/1920,H/1080);
    try{SCENES[name](ctx,1920,1080)}catch(e){status.textContent+="\n"+name+": "+e.stack}
    if(show)document.body.appendChild(c);
    else{const pre=document.createElement("pre");pre.id="png-"+name;pre.textContent=c.toDataURL("image/png");document.body.appendChild(pre)}
  }
  document.body.appendChild(status);
}
main();
